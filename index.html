<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FarmaControl</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231351B4'/><text x='50%25' y='54%25' font-family='Georgia,serif' font-size='28' font-weight='900' fill='white' text-anchor='middle' dominant-baseline='middle' letter-spacing='-2'>FC</text></svg>"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<style>
:root{
  --blue-900:#0A2D6E;--blue-800:#0E3D96;--blue-700:#1351B4;--blue-600:#1A64D6;
  --blue-200:#BFDBFE;--blue-100:#DBEAFE;--blue-50:#EFF6FF;
  --green-700:#0C6B3E;--green-600:#15803D;--green-100:#DCFCE7;--green-50:#F0FDF4;
  --red-700:#B91C1C;--red-600:#DC2626;--red-100:#FEE2E2;--red-50:#FEF2F2;
  --amber-700:#B45309;--amber-100:#FEF3C7;--amber-50:#FFFBEB;
  --gray-900:#0F172A;--gray-800:#1E293B;--gray-700:#334155;--gray-600:#475569;
  --gray-500:#64748B;--gray-400:#94A3B8;--gray-300:#CBD5E1;--gray-200:#E2E8F0;
  --gray-100:#F1F5F9;--gray-50:#F8FAFC;--white:#FFFFFF;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(19,81,180,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 8px 32px rgba(19,81,180,.12),0 4px 8px rgba(0,0,0,.06);
  --shadow-xl:0 16px 48px rgba(19,81,180,.16),0 8px 16px rgba(0,0,0,.08);
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:18px;--r-2xl:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#EEF2F7;color:var(--gray-800);padding-bottom:72px;font-size:14px;line-height:1.5}

/* ── INPUTS ── */
.inp{width:100%;background:var(--white);border:1.5px solid var(--gray-300);border-radius:var(--r-md);padding:11px 14px;font-size:14px;outline:none;margin-bottom:10px;transition:border-color .18s,box-shadow .18s;color:var(--gray-800);font-family:inherit}
.inp:focus{border-color:var(--blue-700);box-shadow:0 0 0 3px rgba(19,81,180,.12);background:var(--white)}
.inp::placeholder{color:var(--gray-400)}
select.inp{cursor:pointer}

/* ── BUTTONS ── */
.bp{background:var(--blue-700);border:none;border-radius:var(--r-md);padding:12px 16px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:background .18s,box-shadow .18s,transform .1s;box-shadow:0 2px 8px rgba(19,81,180,.28);font-family:inherit;letter-spacing:.01em}
.bp:hover:not(:disabled){background:var(--blue-800);box-shadow:0 4px 14px rgba(19,81,180,.38)}
.bp:active:not(:disabled){transform:translateY(1px)}
.bs{background:var(--white);border:1.5px solid var(--gray-300);border-radius:var(--r-md);padding:11px 16px;color:var(--gray-700);font-size:14px;font-weight:500;cursor:pointer;width:100%;transition:border-color .18s,background .18s;font-family:inherit}
.bs:hover:not(:disabled){border-color:var(--gray-400);background:var(--gray-50)}
.bg{background:var(--green-700);border:none;border-radius:var(--r-md);padding:12px 16px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:background .18s,box-shadow .18s;box-shadow:0 2px 8px rgba(12,107,62,.28);font-family:inherit}
.bg:hover:not(:disabled){background:var(--green-600);box-shadow:0 4px 14px rgba(12,107,62,.38)}
.br{background:var(--red-700);border:none;border-radius:var(--r-md);padding:12px 16px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:background .18s,box-shadow .18s;box-shadow:0 2px 8px rgba(185,28,28,.28);font-family:inherit}
.br:hover:not(:disabled){background:var(--red-600)}

/* ── ALERTS ── */
.ok{background:var(--green-50);border:1px solid #86EFAC;border-radius:var(--r-md);padding:10px 14px;color:var(--green-700);font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:500}
.er{background:var(--red-50);border:1px solid #FCA5A5;border-radius:var(--r-md);padding:10px 14px;color:var(--red-700);font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:500}
.wn{background:var(--amber-50);border:1px solid #FCD34D;border-radius:var(--r-md);padding:10px 14px;color:var(--amber-700);font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:500}
.inf{background:var(--blue-50);border:1px solid var(--blue-200);border-radius:var(--r-md);padding:10px 14px;color:var(--blue-700);font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:500}

/* ── CARD ── */
.card{background:var(--white);border-radius:var(--r-xl);box-shadow:var(--shadow-md);border:1px solid var(--gray-200);}
.ch{padding:14px 20px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;background:var(--gray-50)}
.ch-title{font-size:13px;font-weight:700;color:var(--gray-800);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.ch-accent{width:3px;height:16px;background:var(--blue-700);border-radius:2px;flex-shrink:0}

/* ── STAT CARD ── */
.stat-card{background:var(--white);border-radius:var(--r-xl);box-shadow:var(--shadow-md);border:1px solid var(--gray-200);padding:18px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:currentColor;opacity:.15}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px;flex-shrink:0}
.stat-val{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);margin-top:2px}
.stat-sub{font-size:11px;color:var(--gray-400);margin-top:2px}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--gray-200);display:flex;z-index:50;height:64px;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.nb{flex:1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;cursor:pointer;position:relative;transition:background .15s}
.nb .ni{font-size:19px;line-height:1;transition:transform .18s}
.nb .nl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;transition:color .15s}
.nb.on .nl{color:var(--blue-700)}
.nb:not(.on) .nl{color:var(--gray-400)}
.nb.on .ni{transform:translateY(-1px)}
.nb:not(.on) .ni{filter:grayscale(.4);opacity:.7}
.nb.on::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2.5px;background:var(--blue-700);border-radius:0 0 3px 3px}
.nbadge{position:absolute;top:6px;right:calc(50% - 20px);background:var(--red-600);color:#fff;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;padding:0 4px;border:2px solid var(--white)}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:11px 16px;text-align:left;font-size:10px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;background:var(--gray-50);border-bottom:1px solid var(--gray-200)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--blue-50)}
.tbl tbody tr:last-child td{border-bottom:none}

/* ── BADGES ── */
.pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-200);background:var(--white);color:var(--gray-600);transition:all .15s;white-space:nowrap}
.pill.act{background:var(--blue-700);color:#fff;border-color:var(--blue-700)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(6px);z-index:999;display:flex;align-items:flex-end}
.modal-content{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.modal-overlay-center{position:fixed;inset:0;background:rgba(15,23,42,0.7);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-content-center{background:#fff;border-radius:24px;padding:28px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.3)}

.history-item{background:var(--gray-50);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;border-left:4px solid var(--blue-700)}
.history-item.edit{border-left-color:var(--amber-700);background:var(--amber-50)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ============================================
// FUNÇÕES DE VALIDAÇÃO E CORREÇÃO DO BUG
// ============================================

// Função para validar categoria de medicamento
function validarCategoria(medicamento) {
  if (!medicamento || !medicamento.categoria) {
    console.error('❌ BUG DETECTADO: Medicamento sem categoria', medicamento);
    return 'Sem Categoria';
  }
  
  // Lista de categorias válidas
  const categoriasValidas = [
    'Injeção',
    'Injetável',
    'Farm. Básica',
    'Controlados',
    'Antibióticos',
    'Psicotrópicos',
    'Genéricos'
  ];
  
  const catTrimmed = String(medicamento.categoria).trim();
  
  // Se a categoria não existe nas válidas, registra o problema
  if (!categoriasValidas.includes(catTrimmed) && catTrimmed !== '') {
    console.warn('⚠️ Categoria desconhecida encontrada:', catTrimmed);
  }
  
  return catTrimmed;
}

// Função para garantir que injetáveis não sejam zerados
function protegerInjetaveis(estoque) {
  if (!estoque || !Array.isArray(estoque)) return [];
  
  return estoque.map(med => {
    const categoria = validarCategoria(med);
    
    // Proteção: se é injetável e quantidade zerou, registra alerta
    if ((categoria === 'Injeção' || categoria === 'Injetável') && med.quantidade <= 0) {
      console.error('🚨 ALERTA: Injetável foi zerado!', med.medicamento, med);
    }
    
    return {
      ...med,
      categoria: categoria,
      quantidade: Math.max(0, Number(med.quantidade) || 0)
    };
  });
}

// ============================================
// COMPONENTE PRINCIPAL
// ============================================

function App() {
  const [tab, setTab] = React.useState('dashboard');
  const [user, setUser] = React.useState(null);
  const [estoque, setEstoque] = React.useState([]);
  const [historico, setHistorico] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [menuAberto, setMenuAberto] = React.useState(false);
  const [showSairModal, setShowSairModal] = React.useState(false);
  
  // Estados para entrada de nota
  const [notaInput, setNotaInput] = React.useState('');
  const [loteInput, setLoteInput] = React.useState('');
  const [validadeInput, setValidadeInput] = React.useState('');
  const [medicamentoInput, setMedicamentoInput] = React.useState('');
  const [categoriaInput, setCategoriaInput] = React.useState('Injeção');
  const [quantidadeInput, setQuantidadeInput] = React.useState('');
  const [mensagem, setMensagem] = React.useState('');
  
  // Estados para histórico e edição
  const [historicoModal, setHistoricoModal] = React.useState(false);
  const [editando, setEditando] = React.useState(null);
  const [edicaoModal, setEdicaoModal] = React.useState(false);

  // Simular login (em produção, usar Firebase)
  React.useEffect(() => {
    const usuarioSimulado = {
      id: '1',
      name: 'Admin',
      role: 'gestor',
      color: '#1351B4'
    };
    setUser(usuarioSimulado);
    setLoading(false);
    
    // Carregar dados do localStorage
    const estoqueSalvo = localStorage.getItem('farmacontrol_estoque');
    const historicoSalvo = localStorage.getItem('farmacontrol_historico');
    
    if (estoqueSalvo) {
      const dados = JSON.parse(estoqueSalvo);
      setEstoque(protegerInjetaveis(dados));
    }
    if (historicoSalvo) {
      setHistorico(JSON.parse(historicoSalvo));
    }
  }, []);

  // Função para adicionar medicamento
  const adicionarMedicamento = () => {
    // Validações
    if (!medicamentoInput.trim()) {
      setMensagem('❌ Digite o nome do medicamento');
      return;
    }
    if (!quantidadeInput || Number(quantidadeInput) <= 0) {
      setMensagem('❌ Digite uma quantidade válida');
      return;
    }
    if (!notaInput.trim()) {
      setMensagem('❌ Digite o número da nota');
      return;
    }

    const novoMed = {
      id: Date.now(),
      medicamento: medicamentoInput.trim(),
      categoria: categoriaInput, // ✅ CORREÇÃO: Sempre salva a categoria correta
      quantidade: Number(quantidadeInput),
      lote: loteInput.trim(),
      validade: validadeInput,
      nota: notaInput.trim(),
      dataEntrada: new Date().toLocaleDateString('pt-BR'),
      horaEntrada: new Date().toLocaleTimeString('pt-BR'),
      usuarioEntrada: user.name,
      editado: false
    };

    // Proteção contra zero injetáveis
    if ((categoriaInput === 'Injeção' || categoriaInput === 'Injetável') && Number(quantidadeInput) === 0) {
      setMensagem('❌ Não é permitido adicionar injetáveis com quantidade zero');
      return;
    }

    // Adicionar ao estoque com validação
    const novoEstoque = [...estoque, novoMed];
    const estoqueValidado = protegerInjetaveis(novoEstoque);
    
    setEstoque(estoqueValidado);
    localStorage.setItem('farmacontrol_estoque', JSON.stringify(estoqueValidado));

    // Adicionar ao histórico
    const novaEntrada = {
      id: Date.now(),
      tipo: 'entrada',
      medicamento: medicamentoInput.trim(),
      categoria: categoriaInput,
      quantidade: Number(quantidadeInput),
      nota: notaInput.trim(),
      data: new Date().toLocaleString('pt-BR'),
      usuario: user.name,
      status: 'Concluído',
      detalhes: {
        lote: loteInput.trim(),
        validade: validadeInput
      }
    };

    const novoHistorico = [novaEntrada, ...historico];
    setHistorico(novoHistorico);
    localStorage.setItem('farmacontrol_historico', JSON.stringify(novoHistorico));

    // Limpar formulário
    setMedicamentoInput('');
    setQuantidadeInput('');
    setNotaInput('');
    setLoteInput('');
    setValidadeInput('');
    setCategoriaInput('Injeção');
    setMensagem('✅ Medicamento adicionado com sucesso!');
    
    setTimeout(() => setMensagem(''), 3000);
  };

  // Função para editar entrada no histórico
  const editarEntrada = (entrada) => {
    if (user.role !== 'gestor' && user.role !== 'tecnico') {
      setMensagem('❌ Apenas gestor e técnico podem editar');
      return;
    }
    
    setEditando(entrada);
    setEdicaoModal(true);
  };

  // Função para salvar edição
  const salvarEdicao = () => {
    if (!editando) return;

    // Atualizar histórico
    const novoHistorico = historico.map(h => 
      h.id === editando.id 
        ? { ...editando, editado: true, ultimaEdicao: new Date().toLocaleString('pt-BR'), usuarioEdicao: user.name }
        : h
    );

    setHistorico(novoHistorico);
    localStorage.setItem('farmacontrol_historico', JSON.stringify(novoHistorico));

    // Se foi entrada, atualizar estoque também
    if (editando.tipo === 'entrada') {
      const novoEstoque = estoque.map(m => 
        m.id === editando.id
          ? { ...editando, quantidade: Number(editando.quantidade) }
          : m
      );
      setEstoque(protegerInjetaveis(novoEstoque));
      localStorage.setItem('farmacontrol_estoque', JSON.stringify(novoEstoque));
    }

    setEdicaoModal(false);
    setMensagem('✅ Edição salva com sucesso!');
    setTimeout(() => setMensagem(''), 3000);
  };

  if (loading) {
    return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:18}}>Carregando...</div>;
  }

  return (
    <div style={{maxWidth:1200,margin:'0 auto'}}>
      {/* Mensagens */}
      {mensagem && (
        <div style={{position:'fixed',top:20,left:20,right:20,zIndex:10000}}>
          <div style={{padding:12,borderRadius:10,background:mensagem.includes('❌')?'#FEE2E2':'#DCFCE7',color:mensagem.includes('❌')?'#991B1B':'#166534',fontSize:14,fontWeight:600}}>
            {mensagem}
          </div>
        </div>
      )}

      {/* Cabeçalho */}
      <div style={{background:'linear-gradient(135deg,#0D1B4B,#1351B4)',color:'#fff',padding:'20px',borderRadius:'0 0 24px 24px',marginBottom:20,boxShadow:'0 4px 20px rgba(19,81,180,0.2)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <h1 style={{fontSize:28,fontWeight:900,marginBottom:4}}>FarmaControl</h1>
            <p style={{fontSize:13,opacity:0.8}}>Bem-vindo, {user.name} ({user.role})</p>
          </div>
          <div style={{fontSize:48}}>💊</div>
        </div>
      </div>

      {/* DASHBOARD */}
      {tab === 'dashboard' && (
        <div style={{padding:20}}>
          <h2 style={{marginBottom:16,fontSize:20,fontWeight:700}}>Dashboard</h2>
          
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:16,marginBottom:24}}>
            <div className="stat-card" style={{color:'#1351B4'}}>
              <div className="stat-icon" style={{background:'rgba(19,81,180,0.1)'}}>📦</div>
              <div className="stat-val">{estoque.length}</div>
              <div className="stat-label">Total de Medicamentos</div>
            </div>
            
            <div className="stat-card" style={{color:'#15803D'}}>
              <div className="stat-icon" style={{background:'rgba(21,128,61,0.1)'}}>💉</div>
              <div className="stat-val">{estoque.filter(m => m.categoria === 'Injeção' || m.categoria === 'Injetável').length}</div>
              <div className="stat-label">Injetáveis</div>
            </div>
            
            <div className="stat-card" style={{color:'#B91C1C'}}>
              <div className="stat-icon" style={{background:'rgba(185,28,28,0.1)'}}>⚠️</div>
              <div className="stat-val">{estoque.filter(m => m.quantidade < 5).length}</div>
              <div className="stat-label">Críticos (&lt;5)</div>
            </div>
            
            <div className="stat-card" style={{color:'#7C3AED'}}>
              <div className="stat-icon" style={{background:'rgba(124,58,237,0.1)'}}>📋</div>
              <div className="stat-val">{historico.length}</div>
              <div className="stat-label">Movimentações</div>
            </div>
          </div>

          <button onClick={() => setHistoricoModal(true)} className="bp">
            📋 Ver Histórico Completo
          </button>
        </div>
      )}

      {/* ENTRADA */}
      {tab === 'entrada' && (
        <div style={{padding:20}}>
          <h2 style={{marginBottom:16,fontSize:20,fontWeight:700}}>Entrada de Medicamentos</h2>
          
          <div className="card" style={{padding:20}}>
            <h3 style={{marginBottom:14,fontSize:16,fontWeight:600}}>Adicionar Novo Medicamento</h3>
            
            <input 
              type="text"
              placeholder="Número da Nota (obrigatório)" 
              value={notaInput}
              onChange={(e) => setNotaInput(e.target.value)}
              className="inp"
            />
            
            <input 
              type="text"
              placeholder="Nome do Medicamento" 
              value={medicamentoInput}
              onChange={(e) => setMedicamentoInput(e.target.value)}
              className="inp"
            />
            
            <select 
              value={categoriaInput}
              onChange={(e) => setCategoriaInput(e.target.value)}
              className="inp"
            >
              <option>Injeção</option>
              <option>Injetável</option>
              <option>Farm. Básica</option>
              <option>Controlados</option>
              <option>Antibióticos</option>
              <option>Psicotrópicos</option>
              <option>Genéricos</option>
            </select>
            
            <input 
              type="number"
              placeholder="Quantidade" 
              value={quantidadeInput}
              onChange={(e) => setQuantidadeInput(e.target.value)}
              className="inp"
            />
            
            <input 
              type="text"
              placeholder="Lote" 
              value={loteInput}
              onChange={(e) => setLoteInput(e.target.value)}
              className="inp"
            />
            
            <input 
              type="date"
              value={validadeInput}
              onChange={(e) => setValidadeInput(e.target.value)}
              className="inp"
            />
            
            <button onClick={adicionarMedicamento} className="bg" style={{marginTop:10}}>
              ✅ Adicionar Medicamento
            </button>
          </div>

          <h3 style={{marginTop:24,marginBottom:14,fontSize:16,fontWeight:600}}>Medicamentos em Estoque</h3>
          
          <div style={{overflowX:'auto'}}>
            <table className="tbl">
              <thead>
                <tr>
                  <th>Medicamento</th>
                  <th>Categoria</th>
                  <th>Qtd</th>
                  <th>Lote</th>
                  <th>Validade</th>
                </tr>
              </thead>
              <tbody>
                {estoque.map(med => (
                  <tr key={med.id}>
                    <td>{med.medicamento}</td>
                    <td>{med.categoria}</td>
                    <td style={{fontWeight:600,color:med.quantidade < 5 ? '#DC2626' : '#0C6B3E'}}>{med.quantidade}</td>
                    <td>{med.lote || '-'}</td>
                    <td>{med.validade || '-'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* HISTÓRICO MODAL */}
      {historicoModal && (
        <div className="modal-overlay-center">
          <div className="modal-content-center">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
              <h2 style={{fontSize:18,fontWeight:700}}>Histórico de Movimentações</h2>
              <button onClick={() => setHistoricoModal(false)} style={{background:'none',border:'none',fontSize:24,cursor:'pointer'}}>✕</button>
            </div>

            <div style={{maxHeight:400,overflowY:'auto'}}>
              {historico.length === 0 ? (
                <p style={{color:'#64748B',textAlign:'center'}}>Nenhuma movimentação ainda</p>
              ) : (
                historico.map(h => (
                  <div key={h.id} className="history-item" style={{marginBottom:12}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:14}}>{h.medicamento}</div>
                        <div style={{fontSize:12,color:'#64748B'}}>Nota: {h.nota}</div>
                      </div>
                      {(user.role === 'gestor' || user.role === 'tecnico') && (
                        <button 
                          onClick={() => editarEntrada(h)}
                          style={{background:'#1351B4',color:'#fff',border:'none',padding:'6px 12px',borderRadius:6,fontSize:12,fontWeight:600,cursor:'pointer'}}
                        >
                          ✏️ Editar
                        </button>
                      )}
                    </div>
                    <div style={{fontSize:12,color:'#475569'}}>
                      <p>Categoria: <strong>{h.categoria}</strong> | Qtd: <strong>{h.quantidade}</strong></p>
                      <p>Data: {h.data}</p>
                      <p>Usuário: {h.usuario}</p>
                      {h.detalhes && (
                        <p>Lote: {h.detalhes.lote || '-'} | Validade: {h.detalhes.validade || '-'}</p>
                      )}
                      {h.editado && (
                        <p style={{color:'#B45309',fontWeight:600}}>✏️ Editado: {h.ultimaEdicao}</p>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}

      {/* EDIÇÃO MODAL */}
      {edicaoModal && editando && (
        <div className="modal-overlay-center">
          <div className="modal-content-center">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
              <h2 style={{fontSize:18,fontWeight:700}}>Editar Entrada</h2>
              <button onClick={() => setEdicaoModal(false)} style={{background:'none',border:'none',fontSize:24,cursor:'pointer'}}>✕</button>
            </div>

            <input 
              type="text"
              placeholder="Número da Nota" 
              value={editando.nota}
              onChange={(e) => setEditando({...editando, nota: e.target.value})}
              className="inp"
            />
            
            <input 
              type="text"
              placeholder="Nome do Medicamento" 
              value={editando.medicamento}
              onChange={(e) => setEditando({...editando, medicamento: e.target.value})}
              className="inp"
            />
            
            <select 
              value={editando.categoria}
              onChange={(e) => setEditando({...editando, categoria: e.target.value})}
              className="inp"
            >
              <option>Injeção</option>
              <option>Injetável</option>
              <option>Farm. Básica</option>
              <option>Controlados</option>
              <option>Antibióticos</option>
              <option>Psicotrópicos</option>
              <option>Genéricos</option>
            </select>
            
            <input 
              type="number"
              placeholder="Quantidade" 
              value={editando.quantidade}
              onChange={(e) => setEditando({...editando, quantidade: Number(e.target.value)})}
              className="inp"
            />
            
            <input 
              type="text"
              placeholder="Lote" 
              value={editando.detalhes?.lote || ''}
              onChange={(e) => setEditando({...editando, detalhes: {...editando.detalhes, lote: e.target.value}})}
              className="inp"
            />
            
            <input 
              type="date"
              value={editando.detalhes?.validade || ''}
              onChange={(e) => setEditando({...editando, detalhes: {...editando.detalhes, validade: e.target.value}})}
              className="inp"
            />

            <div style={{display:'flex',gap:10}}>
              <button onClick={() => setEdicaoModal(false)} className="bs">Cancelar</button>
              <button onClick={salvarEdicao} className="bg">Salvar Edição</button>
            </div>
          </div>
        </div>
      )}

      {/* RODAPÉ DE NAVEGAÇÃO */}
      <nav className="bnav">
        <button 
          className={'nb' + (tab === 'dashboard' ? ' on' : '')}
          onClick={() => setTab('dashboard')}
        >
          <span className="ni">🏠</span>
          <span className="nl">Início</span>
        </button>
        <button 
          className={'nb' + (tab === 'entrada' ? ' on' : '')}
          onClick={() => setTab('entrada')}
        >
          <span className="ni">📥</span>
          <span className="nl">Entrada</span>
        </button>
        <button className="nb" onClick={() => setShowSairModal(true)}>
          <span className="ni">🚪</span>
          <span className="nl">Sair</span>
        </button>
      </nav>

      {/* MODAL DE SAIR */}
      {showSairModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(15,23,42,0.7)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:20,backdropFilter:'blur(6px)'}}>
          <div style={{background:'#fff',borderRadius:24,padding:28,maxWidth:320,width:'100%',boxShadow:'0 24px 64px rgba(0,0,0,0.3)',textAlign:'center'}}>
            <div style={{fontSize:32,marginBottom:16}}>🚪</div>
            <div style={{fontWeight:800,fontSize:18,color:'#1E293B',marginBottom:8}}>Sair do FarmaControl?</div>
            <div style={{fontSize:13,color:'#64748B',lineHeight:1.6,marginBottom:24}}>Todas as movimentações são salvas automaticamente.</div>
            <div style={{display:'flex',gap:10}}>
              <button onClick={() => setShowSairModal(false)} className="bs" style={{flex:1}}>Cancelar</button>
              <button onClick={() => window.location.reload()} className="br" style={{flex:1}}>Sair</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
</body>
</html>
